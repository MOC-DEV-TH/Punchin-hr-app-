name: hr_app
description: "MOC HR-App project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+4

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  #routing
  go_router: ^18.1.0

  #riverpod:
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  #localization:
  easy_localization: ^3.0.7+1

  #network:
  dio: ^5.8.0+1

  #http:
  http: ^1.4.0

  #cached_network_image:
  cached_network_image: ^4.0.4

  #get_storage:
  get_storage: ^2.1.1

  #flutter_spinkit:
  flutter_spinkit: ^5.2.1

  #geolocator:
  geolocator: ^14.0.2

  #geocoding:
  geocoding: ^5.0.0

  #dropdown_button2:
  dropdown_button2: ^3.1.0

  #flutter_bounceable:
  flutter_bounceable: ^1.2.0

  #loading_indicator:
  loading_indicator: ^4.0.2

  #firebase messaging:
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0

  #shared_preferences:
  shared_preferences: ^2.5.3

  #permission_handler:
  permission_handler: ^13.0.2

  #flutter_html:
  flutter_html: ^3.0.0

  #intl:
  intl: ^0.20.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.0

  #syncfusion_flutter_chat:
  syncfusion_flutter_charts: any

  #month_picker_dialog:
  month_picker_dialog: ^6.7.0

dependency_overrides:
  html: 0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Code Generation
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1


flutter:
  uses-material-design: true

  #---------------- ./ LOCAL ASSETS ----------------#
  assets:
    - assets/images/

  #---------------- ./ LOCAL FONTS ----------------#
  fonts:
    - family: FuturuRegular
      fonts:
        - asset: fonts/futuru-regular.ttf
    - family: RinkRegular
      fonts:
        - asset: fonts/rink-regular.ttf

